{% extends 'layouts/base.html' %}

{% block title %}Remover {{ pet.name }} — Gateen{% endblock %}

{% block content %}
<div class="min-vh-75 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6 text-center">
        <div class="card border-0 shadow auth-card p-5">
          <div class="auth-header-icon mx-auto mb-3"
            style="background:#fdf2f2;color:var(--danger);">
            <i class="fa fa-trash"></i>
          </div>
          <h4 class="fw-800 mb-2">Remover {{ pet.name }}?</h4>
          <p class="text-muted mb-4">Esta ação não pode ser desfeita.</p>
          <form method="post" class="d-flex gap-2 justify-content-center">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger rounded-pill fw-700 px-4">
              Sim, remover
            </button>
            <a href="{% url 'accounts:profile' %}"
              class="btn btn-outline-secondary rounded-pill px-4">
              Cancelar
            </a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
