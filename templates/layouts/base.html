<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ SITE_TAGLINE }}{% endblock %}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'base/css/base.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<!-- ↓ MUDANÇA: classe page-wrapper para sticky footer -->
<body class="d-flex flex-column min-vh-100">

  {% include 'includes/navbar.html' %}

  {% if messages %}
  <div class="position-fixed top-0 start-50 translate-middle-x w-100" 
       style="z-index: 1055; max-width: 500px; margin-top: 90px; pointer-events: none;" 
       id="messagesContainer">
    <div class="px-3">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-lg border-0" 
           style="pointer-events: auto; background-color: #fff; border-left: 5px solid {% if message.tags == 'success' %}#27ae60{% elif message.tags == 'error' %}#dc3545{% else %}#0d6efd{% endif %} !important;" 
           role="alert">
        <i class="fa fa-{% if message.tags == 'success' %}check-circle text-success{% elif message.tags == 'error' or message.tags == 'danger' %}exclamation-circle text-danger{% else %}info-circle text-primary{% endif %} me-2 fs-5 align-middle"></i>
        <span class="fw-600 text-dark">{{ message }}</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <main id="main-content" class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  {% include 'includes/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'base/js/base.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
