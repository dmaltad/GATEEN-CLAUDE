<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ SITE_TAGLINE }}{% endblock %}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'base/css/base.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<!-- ↓ MUDANÇA: classe page-wrapper para sticky footer -->
<body class="page-wrapper">

  {% include 'includes/navbar.html' %}

  <!-- Mensagens do sistema -->
  {% if messages %}
  <div class="messages-container" id="messagesContainer">
    <div class="container">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show gateen-alert"
        role="alert">
        <i class="fa fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' or message.tags == 'danger' %}exclamation-circle{% else %}info-circle{% endif %} me-2"></i>
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"
          aria-label="Fechar"></button>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <!-- ↓ MUDANÇA: main cresce para empurrar o footer para baixo -->
  <main id="main-content" class="main-content">
    {% block content %}{% endblock %}
  </main>

  {% include 'includes/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'base/js/base.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
