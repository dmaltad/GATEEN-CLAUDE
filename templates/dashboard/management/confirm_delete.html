{% extends 'layouts/base.html' %}

{% block title %}Confirmar exclusão — Gateen{% endblock %}

{% block content %}
<div class="min-vh-75 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6">
        <div class="card border-0 shadow text-center p-5" style="border-radius:20px;">
          <div class="mb-4 d-flex align-items-center justify-content-center
            mx-auto rounded-circle" style="
            width:72px;height:72px;
            background:#fee2e2;color:#dc2626;font-size:1.8rem;">
            <i class="fa fa-trash"></i>
          </div>
          <h4 class="fw-800 mb-2">Excluir {{ type }}?</h4>
          <p class="text-muted mb-1 fw-600">{{ object }}</p>
          <p class="text-muted small mb-4">
            Esta ação não pode ser desfeita.
          </p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
              <button type="submit"
                class="btn btn-danger rounded-pill fw-700 px-4">
                Sim, excluir
              </button>
              <a href="{{ request.META.HTTP_REFERER|default:'/' }}"
                class="btn btn-outline-secondary rounded-pill px-4">
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
