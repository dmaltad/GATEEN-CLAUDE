{% extends 'layouts/base.html' %}
{% block title %}Verifique seu E-mail — Gateen{% endblock %}
{% block content %}
<div class="min-vh-75 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6 text-center">
        <div class="card auth-card p-5">
          <div class="auth-header-icon mx-auto mb-3" style="background:#f0fdf4;">
            <i class="fa fa-paper-plane" style="color:var(--success);"></i>
          </div>
          <h4 class="fw-800 mb-2">Verifique seu e-mail</h4>
          <p class="text-muted mb-4">
            Enviamos um link de verificação para o seu e-mail.
            Clique no link para ativar sua conta.
          </p>
          <a href="{% url 'account_login' %}"
            class="btn btn-primary rounded-pill fw-700">
            <i class="fa fa-sign-in-alt me-2"></i>Ir para o login
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
