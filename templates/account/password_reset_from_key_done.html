{% extends 'layouts/base.html' %}

{% block title %}Senha Redefinida — Gateen{% endblock %}

{% block content %}
<div class="min-vh-75 d-flex align-items-center py-5"
  style="background: linear-gradient(135deg, var(--primary-bg-soft), #fff);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6 text-center">
        <div class="card auth-card p-5">
          <div class="auth-header-icon mx-auto mb-4" style="background:#f0fdf4;">
            <i class="fa fa-check-circle" style="color:var(--success);"></i>
          </div>
          <h4 class="fw-800 mb-2">Senha redefinida!</h4>
          <p class="text-muted mb-4">Sua senha foi alterada com sucesso. Faça login para continuar.</p>
          <a href="{% url 'account_login' %}" class="btn btn-primary rounded-pill fw-700">
            <i class="fa fa-sign-in-alt me-2"></i>Entrar agora
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
