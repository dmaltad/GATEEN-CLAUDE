{% extends 'layouts/base.html' %}
{% block title %}Confirmar Código — Gateen{% endblock %}
{% block content %}
<div class="min-vh-75 d-flex align-items-center py-5"
  style="background:linear-gradient(135deg,var(--primary-bg-soft),#fff);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6">
        <div class="text-center mb-4">
          <div class="auth-header-icon mx-auto mb-3"><i class="fa fa-mobile-alt"></i></div>
          <h3 class="fw-800">Confirmar código</h3>
          <p class="text-muted">Digite o código enviado para seu e-mail.</p>
        </div>
        <div class="card auth-card">
          <div class="card-body p-4 p-md-5">
            <form method="post">
              {% csrf_token %}
              {{ form.as_p }}
              {% if form.errors %}
              <div class="alert alert-danger rounded-3 small mb-3">
                Código inválido ou expirado.
              </div>
              {% endif %}
              <button type="submit" class="btn btn-primary w-100 rounded-pill fw-700">
                <i class="fa fa-check me-2"></i>Confirmar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
