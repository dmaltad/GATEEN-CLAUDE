{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Esqueci a Senha — Gateen{% endblock %}

{% block content %}
<div class="min-vh-75 d-flex align-items-center py-5"
  style="background: linear-gradient(135deg, var(--primary-bg-soft), #fff);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6">

        <div class="text-center mb-4">
          <div class="auth-header-icon mb-3">
            <i class="fa fa-lock-open"></i>
          </div>
          <h3 class="fw-800">Esqueceu a senha?</h3>
          <p class="text-muted">
            Informe seu e-mail e enviaremos um link para você redefinir a senha.
          </p>
        </div>

        <div class="card auth-card">
          <div class="card-body p-4 p-md-5">
            <form method="post" action="{% url 'account_reset_password' %}">
              {% csrf_token %}
              <div class="mb-4">
                <label class="form-label fw-600 small">E-mail cadastrado</label>
                <input type="email" name="email" class="form-control auth-input"
                  placeholder="seu@email.com" required autocomplete="email">
              </div>
              <button type="submit" class="btn btn-primary w-100 rounded-pill fw-700">
                <i class="fa fa-paper-plane me-2"></i>Enviar link de redefinição
              </button>
            </form>
            <hr class="my-3">
            <p class="text-center small text-muted mb-0">
              <a href="{% url 'account_login' %}" class="text-decoration-none fw-600"
                style="color:var(--primary);">
                <i class="fa fa-arrow-left me-1"></i>Voltar para o login
              </a>
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
